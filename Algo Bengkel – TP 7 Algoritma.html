ang terperangkap di tangki.","Agar kawat las tidak cepat habis terbakar.","Karena warna tangki bisa memudar.","Mengikuti instruksi perangkat lunak komputer semata."],answer:1,why:"Algoritma K3 adalah runtunan logis yang mengunci keselamatan kerja juru las. Urutan langkah bukan formalitas."}],tbsm:[{q:"Toko suku cadang menata rantai motor terurut berdasarkan jumlah mata rantai: 98, 100, 104, 108, 112, 120, 128, 130. Mekanik mencari rantai 128 mata dengan Binary Search. Elemen pertama yang diperiksa komputer sebagai titik tengah adalah...",options:["98","108","128","130","100"],answer:1,why:"Dari 8 data terurut, titik tengah adalah elemen ke-4, yaitu 108."},{q:"Mengapa algoritma troubleshooting motor injeksi yang mati mendadak mendahulukan cek sekring dan tegangan aki sebelum memeriksa injektor atau membongkar silinder?",options:["Karena sekring adalah komponen paling mahal.","Karena memeriksa sumber daya utama butuh waktu paling singkat dan berpeluang jadi sumber masalah paling mendasar (dekomposisi & kompleksitas langkah).","Karena mekanik tidak boleh memakai kunci pas di awal servis.","Karena injektor tidak pernah rusak.","Agar tagihan servis pelanggan lebih mahal."],answer:1,why:"Algoritma pemecahan masalah otomotif memprioritaskan pemeriksaan berbiaya langkah rendah dan berdampak sistemik sebelum proses yang kompleks."},{q:"Celah katup empat motor bebek: 0.10, 0.05, 0.15, 0.08 mm. Diurutkan menaik dengan Bubble Sort, susunan tepat setelah Pass 1 selesai adalah...",options:["0.05, 0.08, 0.10, 0.15","0.05, 0.10, 0.08, 0.15","0.15, 0.10, 0.08, 0.05","0.05, 0.15, 0.10, 0.08","0.10, 0.05, 0.08, 0.15"],answer:1,why:"Pass 1: (0.10, 0.05) tukar → 0.05, 0.10, 0.15, 0.08; (0.10, 0.15) tetap; (0.15, 0.08) tukar → 0.05, 0.10, 0.08, 0.15. Nilai terbesar sudah di ujung."}]},z={tl:[{crit:"Pemahaman Algoritma Searching Kejuruan",levels:["Tidak mampu memperagakan kedua algoritma pencarian bahan las.","Mampu Linear Search, tapi kesulitan membagi dua rentang pada Binary Search.","Langkah pencarian tepat, namun ada satu kekeliruan kecil menentukan indeks nilai tengah.","Mampu memperagakan dan menghitung langkah Linear & Binary Search pada data bahan las dengan 100% akurat dan logis."]},{crit:"Keterampilan Simulasi Sorting Bahan Las",levels:["Tidak memahami konsep pertukaran elemen bersebelahan.","Ada kesalahan mencatat jumlah swap pada Pass 2.","Penukaran benar, namun penjelasan alur perbandingan kurang runtut.","Seluruh tahap swap Bubble Sort presisi dan mampu menjelaskan perpindahan elemen arus las secara kritis."]},{crit:"Analisis Kontekstual Bengkel Las",levels:["Tidak mengisi kolom analisis studi kasus.","Analisis hanya menyalin teori umum tanpa mengaitkan dengan realitas bengkel las.","Analisis menghubungkan efisiensi algoritma dengan pekerjaan las, tapi masih umum.","Analisis mendalam tentang korelasi efisiensi algoritma dengan penghematan waktu fabrikasi las secara realistis."]}],tbsm:[{crit:"Penerapan Algoritma Searching Otomotif",levels:["Tidak mampu melakukan simulasi pencarian suku cadang.","Mampu menghitung Linear Search, tapi salah menghitung iterasi Binary Search.","Perhitungan langkah benar, namun ragu menentukan sub-array paruh kanan.","Menghitung dan memvisualisasikan perbandingan langkah Linear vs Binary Search pada suku cadang motor tanpa kesalahan."]},{crit:"Keterampilan Simulasi Sorting Data Bengkel",levels:["Gagal mengurutkan data kompresi motor.","Ada kesalahan urutan perbandingan elemen bersebelahan pada Pass 1.","Tabel penukaran benar, namun kalkulasi total swap kurang teliti.","Mengisi seluruh tabel penukaran Bubble Sort kompresi motor secara presisi dan menjelaskan peran swap secara logis."]},{crit:"Analisis Kinerja Pelayanan Bengkel Motor",levels:["Tidak memberikan analisis studi kasus.","Analisis bersifat teoretis dan tidak menggambarkan operasional bengkel nyata.","Analisis cukup baik menghubungkan efisiensi komputasi dengan antrean bengkel, tapi belum spesifik.","Analisis kritis tentang korelasi efisiensi algori
